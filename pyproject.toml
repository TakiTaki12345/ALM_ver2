[project]
name = "alm"
version = "0.1.0"
description = "Asset-liability management toolkit for banks and life insurers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TakiTaki12345", email = "282284815+TakiTaki12345@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]